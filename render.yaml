# Render blueprint — the always-on backend.
#
#   1. Push this file.
#   2. Render dashboard -> New -> Blueprint -> pick this repo.
#   3. Set the two secrets it cannot generate (CEREBRAS_API_KEY, EXTRA_ALLOWED_ORIGINS).
#
# Postgres and Redis are created and wired automatically. Neo4j is not offered by
# Render; leave NEO4J_URI unset and the graph features report themselves degraded
# rather than failing — related-party clusters and circular-flow detection go quiet,
# every financial figure still computes. Point it at a free Neo4j Aura instance to
# turn them back on.
#
# Sizing is measured, not guessed: 140 MB resident at rest, 410 MB peak during a
# full verification run. `starter` is 512 MB and fits with ~100 MB of headroom.

services:
  - type: web
    name: revenueproof-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore          # closest to an India-facing dataset
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production

      # Generated once by Render and never printed. A development JWT secret in
      # production means every session token can be forged by anyone who has read
      # the source, so start-up refuses to call itself production-ready without it.
      - key: JWT_SECRET
        generateValue: true

      # Fernet key for provider tokens at rest. Must be a urlsafe base64 32-byte
      # key — `generateValue` produces a plain random string, so this one is set by
      # hand from:  python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: TOKEN_ENCRYPTION_KEY
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: revenueproof-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: revenueproof-cache
          property: connectionString

      # The deployed frontend is on a different origin, so it has to be named here
      # or the browser refuses every request from it.
      - key: EXTRA_ALLOWED_ORIGINS
        sync: false

      # Contract reading and the critic's prose. Without it every financial figure
      # still computes — the money engine, reconciliation, classification and the
      # rule-based detectors are pure Python.
      - key: CEREBRAS_API_KEY
        sync: false

      # Optional: a free Neo4j Aura instance turns the graph detectors back on.
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false

  # Redis backs the idempotency claims that stop two pipeline runs overlapping on
  # one workspace. Without it a run can still proceed, but the guard that turned a
  # deadlock into a clean "already running" message would be gone.
  - type: keyvalue
    name: revenueproof-cache
    region: singapore
    plan: free
    ipAllowList: []          # reachable only from inside the Render network

databases:
  - name: revenueproof-db
    databaseName: revenueproof
    user: revenueproof
    plan: basic-256mb
    region: singapore
